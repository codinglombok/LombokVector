[package]
name = "lombokvector"
version = "0.1.0"
edition = "2021"
authors = ["codinglombok"]
license = "Apache-2.0"
description = "SIMD-optimized vector math for RAG systems — cosine similarity, dot product, L2 distance, normalization. Zero dependencies, no_std compatible."
repository = "https://github.com/codinglombok/LombokVector"
keywords = ["vector", "simd", "cosine-similarity", "rag", "embedding"]
categories = ["mathematics", "algorithms", "no-std"]
readme = "../README.md"

[features]
default = ["std", "auto-detect"]
std = []
auto-detect = ["std"]
avx2 = []
avx512 = []
neon = []
wasm-simd = []
portable = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_ops"
harness = false
