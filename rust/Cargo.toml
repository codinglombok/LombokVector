[package]
name = "lombokvector"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
authors = ["codinglombok"]
license = "Apache-2.0"
description = "Vector math with bit-identical results across Rust, TypeScript, Python, Go and PHP: dot product, cosine similarity, L2 distance, normalization, batch ranking. SIMD (AVX2, NEON, WASM) without changing results. Zero dependencies, no_std."
repository = "https://github.com/codinglombok/LombokVector"
readme = "README.md"
keywords = ["vector", "simd", "cosine-similarity", "embedding", "no-std"]
categories = ["mathematics", "algorithms", "no-std"]
exclude = ["target/"]

[features]
default = ["std"]
# runtime CPU feature detection and std::error::Error
std = ["alloc"]
# functions that return Vec (normalize, vec_add, batch_*, distance_matrix_*)
alloc = []
# always use the scalar kernels (results are identical; useful for testing)
portable = []
# C ABI functions declared in c-headers/lombokvector.h
ffi = []

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "bench_ops"
harness = false
